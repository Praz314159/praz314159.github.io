<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-nav">
    <nav>
      <a class="home" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <span class="links">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/#papers' | relative_url }}">Papers</a>
        <a href="{{ '/#talks' | relative_url }}">Talks</a>
        <a href="{{ '/#work' | relative_url }}">Work</a>
        <a href="{{ '/writing/' | relative_url }}">Writing</a>
        <a href="{{ '/parerga/' | relative_url }}">Parerga</a>
      </span>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>© {{ 'now' | date: '%Y' }} {{ site.title }}</footer>
</body>
</html>
